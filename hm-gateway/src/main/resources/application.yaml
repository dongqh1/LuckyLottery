server:
  port: 8080
spring:
  application:
    name: gateway
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:18848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        enabled: true
        register-enabled: true
        group: DEFAULT_GROUP
    gateway:
      server:
        webflux:
          routes:
            - id: item-service
              uri: lb://item-service
              predicates:
                - Path=/items/**,/search/**
              filters:
                - AddRequestHeader=truth, anyone will be rich
            - id: cart-service
              uri: lb://cart-service
              predicates:
                - Path=/carts/**
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/addresses/**,/users/**
            - id: trade-service
              uri: lb://trade-service
              predicates:
                - Path=/orders/**
            - id: pay-service
              uri: lb://pay-service
              predicates:
                - Path=/pay-orders/**
            - id: marketing-payment-callback-compat
              uri: lb://marketing-service
              predicates:
                - Path=/api/callbacks/payments,/api/callbacks/payments/**
              filters:
                - StripPrefix=1
            - id: marketing-payment-callback-native
              uri: lb://marketing-service
              predicates:
                - Path=/callbacks/payments,/callbacks/payments/**
            - id: marketing-legacy
              uri: lb://marketing-service
              predicates:
                - Path=/api/**
hm:
  marketing:
    base-url: ${MARKETING_BASE_URL:http://localhost:8080}
  jwt:
    public-key-location: classpath:hmall-public.pem
  auth:
    excludePaths:
      - GET /search/**
      - POST /search/filters
      - POST /users/login
      - GET /items/**
      - GET /hi
      - POST /api/shipping/callbacks/logistics
