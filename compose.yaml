name: ${COMPOSE_PROJECT_NAME:-hmall-lottery}

x-java-healthcheck: &java-healthcheck
  interval: 5s
  timeout: 3s
  retries: 20
  start_period: 20s

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-13307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/conf/hm.cnf:/etc/mysql/conf.d/hm.cnf:ro
      - ./mysql/init/hmall.sql:/docker-entrypoint-initdb.d/001_hmall.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --protocol=TCP -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.3.5-management-alpine
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?set RABBITMQ_USERNAME in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/dongqh}
      TZ: Asia/Shanghai
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  schema-init:
    image: mysql:8.4
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_PASSWORD: ${LUCKYHUB_DB_PASSWORD:?set LUCKYHUB_DB_PASSWORD in .env}
      HM_ITEM_DB_PASSWORD: ${HM_ITEM_DB_PASSWORD:-change-item-db-password}
      HM_CART_DB_PASSWORD: ${HM_CART_DB_PASSWORD:-change-cart-db-password}
      HM_USER_DB_PASSWORD: ${HM_USER_DB_PASSWORD:?set HM_USER_DB_PASSWORD in .env}
      HM_TRADE_DB_PASSWORD: ${HM_TRADE_DB_PASSWORD:?set HM_TRADE_DB_PASSWORD in .env}
      HM_PAY_DB_PASSWORD: ${HM_PAY_DB_PASSWORD:?set HM_PAY_DB_PASSWORD in .env}
      NACOS_DB_PASSWORD: ${NACOS_DB_PASSWORD:?set NACOS_DB_PASSWORD in .env}
      SEATA_DB_PASSWORD: ${SEATA_DB_PASSWORD:?set SEATA_DB_PASSWORD in .env}
    volumes:
      - ./mysql/migrations/V001__hmall_marketing_integration.sql:/migrations/V001__hmall_marketing_integration.sql:ro
      - ./mysql/migrations/V002__hmall_order_membership_pricing.sql:/migrations/V002__hmall_order_membership_pricing.sql:ro
      - ./mysql/migrations/V003__hmall_order_coupon_pricing.sql:/migrations/V003__hmall_order_coupon_pricing.sql:ro
      - ./mysql/migrations/V004__create_item_service_database.sql:/migrations/V004__create_item_service_database.sql:ro
      - ./mysql/migrations/V005__create_cart_service_database.sql:/migrations/V005__create_cart_service_database.sql:ro
      - ./mysql/migrations/V006__create_user_service_database.sql:/migrations/V006__create_user_service_database.sql:ro
      - ./mysql/migrations/V007__create_trade_service_database.sql:/migrations/V007__create_trade_service_database.sql:ro
      - ./mysql/migrations/V008__create_pay_service_database.sql:/migrations/V008__create_pay_service_database.sql:ro
      - ./mysql/migrations/V009__add_trade_message_outbox.sql:/migrations/V009__add_trade_message_outbox.sql:ro
      - ./mysql/migrations/V010__add_pay_message_outbox.sql:/migrations/V010__add_pay_message_outbox.sql:ro
      - ./mysql/nacos.sql:/migrations/nacos.sql:ro
      - ./mysql/seata/seata-tc.sql:/migrations/seata-tc.sql:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        password_hex="$$(printf '%s' "$$MYSQL_PASSWORD" | od -An -tx1 | tr -d ' \n')"
        mysql --protocol=TCP -h mysql -uroot -p"$$MYSQL_ROOT_PASSWORD" \
          --init-command="SET @luckyhub_password = CONVERT(X'$${password_hex}' USING utf8mb4)" \
          < /migrations/V001__hmall_marketing_integration.sql
        mysql --protocol=TCP -h mysql -uroot -p"$$MYSQL_ROOT_PASSWORD" \
          < /migrations/V002__hmall_order_membership_pricing.sql
        mysql --protocol=TCP -h mysql -uroot -p"$$MYSQL_ROOT_PASSWORD" \
          < /migrations/V003__hmall_order_coupon_pricing.sql
        item_password_hex="$$(printf '%s' "$$HM_ITEM_DB_PASSWORD" | od -An -tx1 | tr -d ' \n')"
        mysql --protocol=TCP -h mysql -uroot -p"$$MYSQL_ROOT_PASSWORD" \
          --init-command="SET @hm_item_password = CONVERT(X'$${item_password_hex}' USING utf8mb4)" \
          < /migrations/V004__create_item_service_database.sql
        cart_password_hex="$$(printf '%s' "$$HM_CART_DB_PASSWORD" | od -An -tx1 | tr -d ' \n')"
        mysql --protocol=TCP -h mysql -uroot -p"$$MYSQL_ROOT_PASSWORD" \
          --init-command="SET @hm_cart_password = CONVERT(X'$${cart_password_hex}' USING utf8mb4)" \
          < /migrations/V005__create_cart_service_database.sql
        user_password_hex="$$(printf '%s' "$$HM_USER_DB_PASSWORD" | od -An -tx1 | tr -d ' \n')"
        mysql --protocol=TCP -h mysql -uroot -p"$$MYSQL_ROOT_PASSWORD" \
          --init-command="SET @hm_user_password = CONVERT(X'$${user_password_hex}' USING utf8mb4)" \
          < /migrations/V006__create_user_service_database.sql
        trade_password_hex="$$(printf '%s' "$$HM_TRADE_DB_PASSWORD" | od -An -tx1 | tr -d ' \n')"
        mysql --protocol=TCP -h mysql -uroot -p"$$MYSQL_ROOT_PASSWORD" \
          --init-command="SET @hm_trade_password = CONVERT(X'$${trade_password_hex}' USING utf8mb4)" \
          < /migrations/V007__create_trade_service_database.sql
        pay_password_hex="$$(printf '%s' "$$HM_PAY_DB_PASSWORD" | od -An -tx1 | tr -d ' \n')"
        mysql --protocol=TCP -h mysql -uroot -p"$$MYSQL_ROOT_PASSWORD" \
          --init-command="SET @hm_pay_password = CONVERT(X'$${pay_password_hex}' USING utf8mb4)" \
          < /migrations/V008__create_pay_service_database.sql
        mysql --protocol=TCP -h mysql -uroot -p"$$MYSQL_ROOT_PASSWORD" \
          < /migrations/V009__add_trade_message_outbox.sql
        mysql --protocol=TCP -h mysql -uroot -p"$$MYSQL_ROOT_PASSWORD" \
          < /migrations/V010__add_pay_message_outbox.sql
        nacos_password_hex="$$(printf '%s' "$$NACOS_DB_PASSWORD" | od -An -tx1 | tr -d ' \n')"
        mysql --protocol=TCP -h mysql -uroot -p"$$MYSQL_ROOT_PASSWORD" \
          --init-command="SET @nacos_db_password = CONVERT(X'$${nacos_password_hex}' USING utf8mb4)" \
          < /migrations/nacos.sql
        seata_password_hex="$$(printf '%s' "$$SEATA_DB_PASSWORD" | od -An -tx1 | tr -d ' \n')"
        exec mysql --protocol=TCP -h mysql -uroot -p"$$MYSQL_ROOT_PASSWORD" \
          --init-command="SET @seata_db_password = CONVERT(X'$${seata_password_hex}' USING utf8mb4)" \
          < /migrations/seata-tc.sql

  marketing-extraction-schema-init:
    profiles: ["marketing-extraction"]
    image: mysql:8.4
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
      schema-init:
        condition: service_completed_successfully
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      COUPON_DB_PASSWORD: ${COUPON_DB_PASSWORD:-}
      POINTS_DB_PASSWORD: ${POINTS_DB_PASSWORD:-}
      MEMBERSHIP_DB_PASSWORD: ${MEMBERSHIP_DB_PASSWORD:-}
      LOTTERY_DB_PASSWORD: ${LOTTERY_DB_PASSWORD:-}
      FULFILLMENT_DB_PASSWORD: ${FULFILLMENT_DB_PASSWORD:-}
    volumes:
      - ./mysql/migrations/V011__create_marketing_domain_service_databases.sql:/migrations/V011__create_marketing_domain_service_databases.sql:ro
      - ./mysql/migrations/V012__create_trade_membership_order.sql:/migrations/V012__create_trade_membership_order.sql:ro
      - ./mysql/migrations/V013__add_pay_order_domain.sql:/migrations/V013__add_pay_order_domain.sql:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        test -n "$$COUPON_DB_PASSWORD" || { echo "COUPON_DB_PASSWORD is required for the extracted marketing services" >&2; exit 1; }
        test -n "$$POINTS_DB_PASSWORD" || { echo "POINTS_DB_PASSWORD is required for the extracted marketing services" >&2; exit 1; }
        test -n "$$MEMBERSHIP_DB_PASSWORD" || { echo "MEMBERSHIP_DB_PASSWORD is required for the extracted marketing services" >&2; exit 1; }
        test -n "$$LOTTERY_DB_PASSWORD" || { echo "LOTTERY_DB_PASSWORD is required for the extracted marketing services" >&2; exit 1; }
        test -n "$$FULFILLMENT_DB_PASSWORD" || { echo "FULFILLMENT_DB_PASSWORD is required for the extracted marketing services" >&2; exit 1; }
        coupon_password_hex="$$(printf '%s' "$$COUPON_DB_PASSWORD" | od -An -tx1 | tr -d ' \n')"
        points_password_hex="$$(printf '%s' "$$POINTS_DB_PASSWORD" | od -An -tx1 | tr -d ' \n')"
        membership_password_hex="$$(printf '%s' "$$MEMBERSHIP_DB_PASSWORD" | od -An -tx1 | tr -d ' \n')"
        lottery_password_hex="$$(printf '%s' "$$LOTTERY_DB_PASSWORD" | od -An -tx1 | tr -d ' \n')"
        fulfillment_password_hex="$$(printf '%s' "$$FULFILLMENT_DB_PASSWORD" | od -An -tx1 | tr -d ' \n')"
        mysql --protocol=TCP -h mysql -uroot -p"$$MYSQL_ROOT_PASSWORD" \
          --init-command="SET @hm_coupon_password = CONVERT(X'$${coupon_password_hex}' USING utf8mb4), @hm_points_password = CONVERT(X'$${points_password_hex}' USING utf8mb4), @hm_membership_password = CONVERT(X'$${membership_password_hex}' USING utf8mb4), @hm_lottery_password = CONVERT(X'$${lottery_password_hex}' USING utf8mb4), @hm_fulfillment_password = CONVERT(X'$${fulfillment_password_hex}' USING utf8mb4)" \
          < /migrations/V011__create_marketing_domain_service_databases.sql
        mysql --protocol=TCP -h mysql -uroot -p"$$MYSQL_ROOT_PASSWORD" \
          < /migrations/V012__create_trade_membership_order.sql
        exec mysql --protocol=TCP -h mysql -uroot -p"$$MYSQL_ROOT_PASSWORD" \
          < /migrations/V013__add_pay_order_domain.sql

  nacos:
    image: nacos/nacos-server:v3.1.1
    restart: unless-stopped
    env_file:
      - ./mysql/nacos/custom.env
    environment:
      MYSQL_SERVICE_PASSWORD: ${NACOS_DB_PASSWORD:?set NACOS_DB_PASSWORD in .env}
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:?set NACOS_AUTH_TOKEN in .env}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:?set NACOS_AUTH_IDENTITY_KEY in .env}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:?set NACOS_AUTH_IDENTITY_VALUE in .env}
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
      NACOS_CONSOLE_PORT: "8080"
      TZ: Asia/Shanghai
    ports:
      - "${NACOS_PORT:-18848}:8848"
      - "${NACOS_GRPC_PORT:-19848}:9848"
      - "${NACOS_CONSOLE_PORT:-18048}:8080"
    volumes:
      - nacos-logs:/home/nacos/logs
    depends_on:
      schema-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/v3/console/health/readiness >/dev/null && bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9848' && curl -fsS -o /dev/null -X POST -d \"username=$$NACOS_USERNAME&password=$$NACOS_PASSWORD\" http://127.0.0.1:8848/nacos/v1/auth/login"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  seata-server:
    build:
      context: .
      dockerfile: seata/Dockerfile
    image: hmall-lottery-seata-server:2.5.0-jdk17-mysql9.7.0
    restart: unless-stopped
    environment:
      SEATA_IP: seata-server
      SEATA_PORT: "8091"
      STORE_MODE: db
      SEATA_DB_PASSWORD: ${SEATA_DB_PASSWORD:?set SEATA_DB_PASSWORD in .env}
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
      SEATA_SECURITY_SECRET_KEY: ${SEATA_SECURITY_SECRET_KEY:?set SEATA_SECURITY_SECRET_KEY in .env}
      TZ: Asia/Shanghai
    ports:
      - "${SEATA_RPC_PORT:-18091}:8091"
    volumes:
      - ./seata/application.yml:/seata-server/resources/application.yml:ro
    depends_on:
      schema-init:
        condition: service_completed_successfully
      nacos:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8091'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  mall-service:
    profiles: ["rollback"]
    build:
      context: .
      dockerfile: mall-backend/hm-service/Dockerfile
    restart: unless-stopped
    environment:
      HM_DB_HOST: mysql
      HM_DB_PORT: "3306"
      HM_DB_PW: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: "6379"
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      COUPON_SERVICE_BASE_URL: http://coupon-service:8080
      MEMBERSHIP_SERVICE_BASE_URL: http://membership-service:8080
      TZ: Asia/Shanghai
    depends_on:
      schema-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  item-service:
    build:
      context: .
      dockerfile: item-service/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: dev
      HM_ITEM_DB_HOST: mysql
      HM_ITEM_DB_PORT: "3306"
      HM_ITEM_DB_PASSWORD: ${HM_ITEM_DB_PASSWORD:?set HM_ITEM_DB_PASSWORD in .env}
      ITEM_FLYWAY_ENABLED: "true"
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
      SEATA_ENABLED: ${SEATA_ENABLED:-true}
      TZ: Asia/Shanghai
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8081'"]
    depends_on:
      schema-init:
        condition: service_completed_successfully
      nacos:
        condition: service_healthy
      seata-server:
        condition: service_healthy

  cart-service:
    build:
      context: .
      dockerfile: cart-service/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: dev
      HM_CART_DB_HOST: mysql
      HM_CART_DB_PORT: "3306"
      HM_CART_DB_PASSWORD: ${HM_CART_DB_PASSWORD:?set HM_CART_DB_PASSWORD in .env}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
      SEATA_ENABLED: ${SEATA_ENABLED:-true}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?set RABBITMQ_USERNAME in .env}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/dongqh}
      TZ: Asia/Shanghai
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8082'"]
    depends_on:
      schema-init:
        condition: service_completed_successfully
      nacos:
        condition: service_healthy
      seata-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: dev
      HM_USER_DB_HOST: mysql
      HM_USER_DB_PORT: "3306"
      HM_USER_DB_PASSWORD: ${HM_USER_DB_PASSWORD:?set HM_USER_DB_PASSWORD in .env}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
      SEATA_ENABLED: ${SEATA_ENABLED:-true}
      TZ: Asia/Shanghai
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8083'"]
    depends_on:
      schema-init:
        condition: service_completed_successfully
      nacos:
        condition: service_healthy
      seata-server:
        condition: service_healthy

  trade-service:
    build:
      context: .
      dockerfile: trade-service/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: dev
      HM_TRADE_DB_HOST: mysql
      HM_TRADE_DB_PORT: "3306"
      HM_TRADE_DB_PASSWORD: ${HM_TRADE_DB_PASSWORD:?set HM_TRADE_DB_PASSWORD in .env}
      TRADE_MEMBERSHIP_PURCHASES_ENABLED: "false"
      TRADE_MEMBERSHIP_BENEFIT_SERVICE_ENABLED: "false"
      TRADE_COUPON_CHECKOUT_SERVICE_ENABLED: "false"
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
      SEATA_ENABLED: ${SEATA_ENABLED:-true}
      COUPON_SERVICE_BASE_URL: http://coupon-service:8080
      MEMBERSHIP_SERVICE_BASE_URL: http://membership-service:8080
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?set RABBITMQ_USERNAME in .env}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/dongqh}
      TZ: Asia/Shanghai
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8084'"]
    depends_on:
      schema-init:
        condition: service_completed_successfully
      nacos:
        condition: service_healthy
      seata-server:
        condition: service_healthy

  pay-service:
    build:
      context: .
      dockerfile: pay-service/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: dev
      HM_PAY_DB_HOST: mysql
      HM_PAY_DB_PORT: "3306"
      HM_PAY_DB_PASSWORD: ${HM_PAY_DB_PASSWORD:?set HM_PAY_DB_PASSWORD in .env}
      PAY_MEMBERSHIP_PURCHASES_ENABLED: "false"
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
      SEATA_ENABLED: ${SEATA_ENABLED:-true}
      COUPON_SERVICE_BASE_URL: http://coupon-service:8080
      MEMBERSHIP_SERVICE_BASE_URL: http://membership-service:8080
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?set RABBITMQ_USERNAME in .env}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/dongqh}
      TZ: Asia/Shanghai
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8085'"]
    depends_on:
      schema-init:
        condition: service_completed_successfully
      nacos:
        condition: service_healthy
      seata-server:
        condition: service_healthy

  coupon-service:
    profiles: ["marketing-extraction"]
    build:
      context: .
      dockerfile: coupon-service/Dockerfile
    restart: unless-stopped
    environment:
      COUPON_DATABASE_URL: "jdbc:mysql://mysql:3306/hm_coupon?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai"
      COUPON_DATABASE_USERNAME: hm_coupon_app
      COUPON_DATABASE_PASSWORD: ${COUPON_DB_PASSWORD:-}
      COUPON_FLYWAY_ENABLED: "true"
      COUPON_MESSAGING_ENABLED: "false"
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
      NACOS_DISCOVERY_REGISTER_ENABLED: "true"
      ITEM_SERVICE_BASE_URL: http://item-service:8081
      USER_SERVICE_BASE_URL: http://user-service:8083
      MEMBERSHIP_SERVICE_BASE_URL: http://membership-service:8080
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?set RABBITMQ_USERNAME in .env}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/dongqh}
      TZ: Asia/Shanghai
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
    depends_on:
      marketing-extraction-schema-init:
        condition: service_completed_successfully
      nacos:
        condition: service_healthy

  points-service:
    profiles: ["marketing-extraction"]
    build:
      context: .
      dockerfile: points-service/Dockerfile
    restart: unless-stopped
    environment:
      POINTS_DATABASE_URL: "jdbc:mysql://mysql:3306/hm_points?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai"
      POINTS_DATABASE_USERNAME: hm_points_app
      POINTS_DATABASE_PASSWORD: ${POINTS_DB_PASSWORD:-}
      POINTS_FLYWAY_ENABLED: "true"
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
      NACOS_DISCOVERY_REGISTER_ENABLED: "true"
      ITEM_SERVICE_BASE_URL: http://item-service:8081
      USER_SERVICE_BASE_URL: http://user-service:8083
      LOGISTICS_SERVICE_BASE_URL: http://logistics-service:8080
      TZ: Asia/Shanghai
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
    depends_on:
      marketing-extraction-schema-init:
        condition: service_completed_successfully
      nacos:
        condition: service_healthy
      logistics-service:
        condition: service_healthy

  membership-service:
    profiles: ["marketing-extraction"]
    build:
      context: .
      dockerfile: membership-service/Dockerfile
    restart: unless-stopped
    environment:
      MEMBERSHIP_DATABASE_URL: "jdbc:mysql://mysql:3306/hm_membership?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai"
      MEMBERSHIP_DATABASE_USERNAME: hm_membership_app
      MEMBERSHIP_DATABASE_PASSWORD: ${MEMBERSHIP_DB_PASSWORD:-}
      MEMBERSHIP_FLYWAY_ENABLED: "true"
      MEMBERSHIP_MESSAGING_ENABLED: "false"
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
      NACOS_DISCOVERY_REGISTER_ENABLED: "true"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?set RABBITMQ_USERNAME in .env}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/dongqh}
      TZ: Asia/Shanghai
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
    depends_on:
      marketing-extraction-schema-init:
        condition: service_completed_successfully
      nacos:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  lottery-service:
    profiles: ["marketing-extraction"]
    build:
      context: .
      dockerfile: lottery-service/Dockerfile
    restart: unless-stopped
    environment:
      LOTTERY_DATABASE_URL: "jdbc:mysql://mysql:3306/hm_lottery?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai"
      LOTTERY_DATABASE_USERNAME: hm_lottery_app
      LOTTERY_DATABASE_PASSWORD: ${LOTTERY_DB_PASSWORD:-}
      LOTTERY_ADMIN_USER_IDS: ${LOTTERY_ADMIN_USER_IDS:-1}
      LOTTERY_FLYWAY_ENABLED: "true"
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
      NACOS_DISCOVERY_REGISTER_ENABLED: "true"
      LOTTERY_REDIS_HOST: redis
      LOTTERY_REDIS_PORT: "6379"
      LOTTERY_REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      LOTTERY_REDIS_DATABASE: "1"
      LOTTERY_OUTBOX_ENABLED: "false"
      LOTTERY_RECONCILIATION_ENABLED: "false"
      LOTTERY_BENEFIT_CLAIM_EXPIRY_ENABLED: "false"
      OSS_ENABLED: ${OSS_ENABLED:-false}
      OSS_REGION: ${OSS_REGION:-}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_PUBLIC_BASE_URL: ${OSS_PUBLIC_BASE_URL:-}
      TZ: Asia/Shanghai
    volumes:
      - lottery-image-data:/app/uploads
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
    depends_on:
      marketing-extraction-schema-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy

  logistics-service:
    profiles: ["marketing-extraction"]
    build:
      context: .
      dockerfile: fulfillment-service/Dockerfile
    restart: unless-stopped
    environment:
      FULFILLMENT_DATABASE_URL: "jdbc:mysql://mysql:3306/hm_fulfillment?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai"
      FULFILLMENT_DATABASE_USERNAME: hm_fulfillment_app
      FULFILLMENT_DATABASE_PASSWORD: ${FULFILLMENT_DB_PASSWORD:-}
      FULFILLMENT_FLYWAY_ENABLED: "true"
      FULFILLMENT_MESSAGING_ENABLED: "true"
      LOGISTICS_ADMIN_USER_IDS: ${LOGISTICS_ADMIN_USER_IDS:-1}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
      NACOS_DISCOVERY_REGISTER_ENABLED: "true"
      FULFILLMENT_ADDRESS_CIPHER_KEY: ${SHIPPING_ADDRESS_KEY:?set SHIPPING_ADDRESS_KEY in .env}
      FULFILLMENT_SHIPPING_CALLBACK_SECRET: ${SHIPPING_CALLBACK_SECRET:?set SHIPPING_CALLBACK_SECRET in .env}
      USER_SERVICE_BASE_URL: http://user-service:8083
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?set RABBITMQ_USERNAME in .env}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/dongqh}
      TZ: Asia/Shanghai
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
    depends_on:
      marketing-extraction-schema-init:
        condition: service_completed_successfully
      nacos:
        condition: service_healthy

  marketing-data-migration:
    profiles: ["marketing-extraction"]
    image: mysql:8.4
    restart: "no"
    depends_on:
      coupon-service:
        condition: service_healthy
      points-service:
        condition: service_healthy
      membership-service:
        condition: service_healthy
      lottery-service:
        condition: service_healthy
      logistics-service:
        condition: service_healthy
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - ./mysql/migrations/V014__migrate_marketing_domain_data.sql:/migrations/V014__migrate_marketing_domain_data.sql:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        exec mysql --protocol=TCP -h mysql -uroot -p"$$MYSQL_ROOT_PASSWORD" \
          < /migrations/V014__migrate_marketing_domain_data.sql

  hm-gateway:
    build:
      context: .
      dockerfile: hm-gateway/Dockerfile
    restart: unless-stopped
    environment:
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
      POINTS_SERVICE_URI: ${POINTS_SERVICE_URI:-http://points-service:8080}
      COUPON_SERVICE_URI: ${COUPON_SERVICE_URI:-http://coupon-service:8080}
      MEMBERSHIP_SERVICE_URI: ${MEMBERSHIP_SERVICE_URI:-http://membership-service:8080}
      LOTTERY_SERVICE_URI: ${LOTTERY_SERVICE_URI:-http://lottery-service:8080}
      LOGISTICS_SERVICE_URI: ${LOGISTICS_SERVICE_URI:-http://logistics-service:8080}
      TZ: Asia/Shanghai
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
    depends_on:
      nacos:
        condition: service_healthy
      item-service:
        condition: service_healthy
      cart-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      trade-service:
        condition: service_healthy
      pay-service:
        condition: service_healthy

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORTAL_PORT:-18080}:18080"
      - "${ADMIN_PORT:-18081}:18081"
    volumes:
      - lottery-image-data:/usr/share/nginx/html/uploads:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:18080/ && wget -q -O /dev/null http://127.0.0.1:18081/items.html"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      hm-gateway:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  nacos-logs:
  lottery-image-data:
