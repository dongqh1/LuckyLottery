<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>营销活动管理 - 黑马商城</title><link rel="stylesheet" href="css/element.css"><link rel="stylesheet" href="css/main.css"><style>body{background:#f5f7fa}.shell{max-width:1250px;margin:25px auto}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.login{max-width:420px;margin:80px auto;background:#fff;padding:35px;border-radius:8px}.nav a{margin-right:18px}</style></head><body><div id="app"><div class="login" v-if="!token"><h2>黑马商城管理员登录</h2><el-input v-model="login.username" placeholder="用户名"></el-input><el-input v-model="login.password" type="password" placeholder="密码" style="margin:12px 0"></el-input><el-button type="primary" @click="doLogin">登录</el-button></div><div class="shell" v-else><div class="toolbar"><div><h1>营销活动管理</h1><div class="nav"><a href="items.html">商品管理</a><a href="users.html">用户管理</a><a href="marketing.html">营销活动</a></div></div><div><el-button type="primary" @click="dialog=true">创建活动</el-button><el-button @click="logout">退出</el-button></div></div><el-table :data="activities" border><el-table-column prop="id" label="ID" width="80"></el-table-column><el-table-column prop="activityName" label="活动名称"></el-table-column><el-table-column prop="status" label="状态" width="120"></el-table-column><el-table-column prop="startTime" label="开始时间"></el-table-column><el-table-column prop="endTime" label="结束时间"></el-table-column><el-table-column label="操作" width="260"><template slot-scope="s"><el-button size="mini" @click="loadPool(s.row)">奖池</el-button><el-button size="mini" type="success" @click="publish(s.row.id)">发布</el-button><el-button size="mini" type="danger" @click="disable(s.row.id)">禁用</el-button></template></el-table-column></el-table><el-dialog title="创建活动" :visible.sync="dialog"><el-form :model="form" label-width="100px"><el-form-item label="活动名称"><el-input v-model="form.activityName"></el-input></el-form-item><el-form-item label="说明"><el-input v-model="form.description"></el-input></el-form-item><el-form-item label="开始时间"><el-date-picker v-model="form.startTime" type="datetime" value-format="yyyy-MM-ddTHH:mm:ss"></el-date-picker></el-form-item><el-form-item label="结束时间"><el-date-picker v-model="form.endTime" type="datetime" value-format="yyyy-MM-ddTHH:mm:ss"></el-date-picker></el-form-item><el-form-item label="未中奖权重"><el-input-number v-model="form.noWinWeight" :min="0"></el-input-number></el-form-item></el-form><span slot="footer"><el-button @click="dialog=false">取消</el-button><el-button type="primary" @click="create">保存</el-button></span></el-dialog><el-dialog title="活动奖池" :visible.sync="poolDialog"><el-table :data="pool"><el-table-column prop="prizeId" label="奖品ID"></el-table-column><el-table-column prop="prizeName" label="奖品"></el-table-column><el-table-column prop="weight" label="权重"></el-table-column><el-table-column prop="totalStock" label="总库存"></el-table-column><el-table-column prop="remainingStock" label="剩余"></el-table-column></el-table></el-dialog></div></div><script src="js/vue.js"></script><script src="js/axios.min.js"></script><script src="js/element.js"></script><script>axios.defaults.baseURL='/api';axios.interceptors.request.use(c=>{c.headers.authorization=sessionStorage.getItem("token");return c});new Vue({el:'#app',data:{token:sessionStorage.getItem("token"),login:{username:'Jack',password:'123'},activities:[],dialog:false,poolDialog:false,pool:[],form:{activityName:'',description:'',startTime:'',endTime:'',noWinWeight:100}},created(){if(this.token)this.load()},methods:{doLogin(){axios.post('/users/login',this.login).then(r=>{sessionStorage.setItem("token",r.data.token);sessionStorage.setItem("user-info",JSON.stringify(r.data));this.token=r.data.token;this.load()}).catch(()=>this.$message.error('登录失败'))},logout(){sessionStorage.clear();location.reload()},load(){axios.get('/marketing/admin/activities',{params:{page:1,size:100}}).then(r=>this.activities=r.data.data.records)},create(){axios.post('/marketing/admin/activities',this.form).then(()=>{this.dialog=false;this.load();this.$message.success('创建成功')})},publish(id){axios.patch('/marketing/admin/activities/'+id+'/publish').then(()=>this.load())},disable(id){axios.patch('/marketing/admin/activities/'+id+'/disable').then(()=>this.load())},loadPool(row){axios.get('/marketing/admin/activities/'+row.id+'/prizes').then(r=>{this.pool=r.data.data;this.poolDialog=true})}}})</script></body></html>
