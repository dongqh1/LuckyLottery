worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 18080;
        server_name _;
        root /usr/share/nginx/html/hmall-portal;
        index index.html;

        include /etc/nginx/snippets/marketing-auth-login.conf;

        location ^~ /api/marketing/ {
            set $gateway_backend hm-gateway:8080;
            rewrite ^/api/marketing/(.*)$ /api/$1 break;
            proxy_pass http://$gateway_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header user-info "";
        }

        location ^~ /api/ {
            set $gateway_backend hm-gateway:8080;
            rewrite ^/api/(?!admin/shipping/|shipping/)(.*)$ /$1 break;
            proxy_pass http://$gateway_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header user-info "";
        }

        location ^~ /uploads/ {
            alias /usr/share/nginx/html/uploads/;
            add_header Cache-Control "public, max-age=604800" always;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }

    server {
        listen 18081;
        server_name _;
        root /usr/share/nginx/html/hmall-admin;
        index index.html;
        absolute_redirect off;

        include /etc/nginx/snippets/marketing-auth-login.conf;

        location = / {
            return 302 /marketing.html;
        }

        location ^~ /api/marketing/ {
            set $gateway_backend hm-gateway:8080;
            rewrite ^/api/marketing/(.*)$ /api/$1 break;
            proxy_pass http://$gateway_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header user-info "";
        }

        location ^~ /api/ {
            set $gateway_backend hm-gateway:8080;
            rewrite ^/api/(?!admin/shipping/|shipping/)(.*)$ /$1 break;
            proxy_pass http://$gateway_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header user-info "";
        }

        location ^~ /uploads/ {
            alias /usr/share/nginx/html/uploads/;
            add_header Cache-Control "public, max-age=604800" always;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
